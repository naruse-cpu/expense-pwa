<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#174c89"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="経費PDF"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>経費PDF作成</title></head><body><header>経費・報告書 PDF作成</header><main>
<section><h2>基本設定 <small>自動保存</small></h2><label>部署<select id="department"><option>第二京都</option><option>第二名古屋</option></select></label><label>名前<input id="name" placeholder="例：成瀬" autocomplete="name"></label></section>
<section><h2>書類を追加 <small>最大5ファイル</small></h2><div class="drop" id="drop"><div class="camera">▧</div><p>領収書・報告書を撮影、または選択</p><div class="actions"><button id="cameraBtn" type="button">カメラで撮影</button><button class="secondary" id="fileBtn" type="button">写真・PDFを選択</button></div><input type="file" id="cameraInput" accept="image/*" capture="environment" hidden><input type="file" id="fileInput" accept="image/*,.pdf,application/pdf" multiple hidden><p class="hint">PCではドラッグ＆ドロップにも対応。画像・PDF混在可。</p></div><div id="fileList"></div></section>
<section><h2>出力情報</h2><label>画像区分<select id="kind"><option>スキャン</option><option>電子</option><option>点検報告</option><option>作業報告</option></select></label><label>日付<input id="date" type="date"></label>
<div id="expenseFields"><label>金額（税込・円）<input id="amount" type="text" inputmode="numeric" placeholder="例：2200"></label><label>勘定科目<select id="category"><option>交通費</option><option>宿泊費</option><option>駐車料金</option><option>その他</option></select></label><label id="otherField" hidden>その他の勘定科目<input id="other" placeholder="勘定科目を入力"></label><label>支払い区分<select id="payment"><option>現金</option><option>クレジット</option></select></label></div>
<div id="reportFields" hidden><label>ユーザー名（必須）<input id="customer" placeholder="例：京都市役所"></label><label>自由欄<input id="free" placeholder="任意"></label></div>
<label>出力ファイル名</label><div class="filename" id="filename"></div></section>
<section><div class="actions"><button id="saveBtn" type="button">PDFを作成・保存</button><button class="secondary" id="shareBtn" type="button">共有</button></div><p id="status" role="status" aria-live="polite"></p><p class="hint">画像はA4に1枚ずつ配置し、PDFは全ページを保持します。ファイルは外部サーバーに送信しません。初回はインターネット接続が必要です。</p></section>
<footer>社内向けツール · 画像は端末内で処理</footer></main><script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script><script src="app.js"></script></body></html>
